<section class="speak-shell">
  <h1 class="speak-shell__title">صوتي</h1>
  <p class="speak-shell__subtitle">
    <bdi>{{ session.board().title['ar'] }}</bdi>
  </p>

  <app-sentence-strip />

  <app-speak-board
    class="speak-shell__board"
    [board]="session.board()"
    (phase)="onPhase($event)"
  />

  @if (audio.fallbackBanner()) {
    <p class="speak-shell__fallback" role="status" data-testid="no-voice-banner">
      {{ audio.fallbackBanner() }}
    </p>
    <p class="speak-shell__fallback-text" data-testid="spoken-fallback">
      <bdi>{{ audio.spokenFallbackText() }}</bdi>
    </p>
  }

  <nav class="speak-shell__links" aria-label="صفحات التجربة">
    <a class="speak-shell__link" routerLink="/audio">تجربة الصوت</a>
    <a class="speak-shell__link" routerLink="/audio/diagnostics">تشخيص الصوت</a>
    <a class="speak-shell__link" routerLink="/storage">التخزين</a>
    <a class="speak-shell__link" routerLink="/voice">تقييم الصوت</a>
  </nav>

  <!-- Egyptian test sentence, isolated so mixed scripts/digits never reorder it. -->
  <p class="speak-shell__sentence" data-testid="test-sentence">
    <bdi>{{ testSentence }}</bdi>
  </p>
</section>
